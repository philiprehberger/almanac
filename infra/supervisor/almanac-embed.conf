; FastAPI embed worker. A single supervisor program runs uvicorn with two
; worker processes via uvicorn's own process manager — running numprocs=2 of the
; same command bound to one fixed port only crash-loops on EADDRINUSE.
; Supervisord restarts on crash; stderr + stdout funnel into logs under
; /var/log/almanac. The shared secret must be provided in supervisord's
; environment (no placeholder is committed); the worker refuses to start unset.

[program:almanac-embed]
command=/var/www/almanac/current/workers/embed/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 8001 --workers 2
directory=/var/www/almanac/current/workers/embed
autostart=true
autorestart=true
numprocs=1
user=ubuntu
environment=ALMANAC_EMBED_WORKER_SHARED_SECRET="%(ENV_ALMANAC_EMBED_WORKER_SHARED_SECRET)s",ALMANAC_EMBED_PROVIDER="mock"
stdout_logfile=/var/log/almanac/embed.out.log
stderr_logfile=/var/log/almanac/embed.err.log
stopasgroup=true
killasgroup=true
priority=20
